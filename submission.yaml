submission:
  title: "GRIDGUARD AI — Power Grid Intelligence & Predictive Risk Management"
  problem_statement: "Power transformer and substation failures cause expensive and disruptive power outages. Traditional maintenance approaches often rely on fixed calendar schedules even though sensor telemetry can reveal degradation weeks in advance. Severe weather can further increase equipment failure risk, but operational systems often fail to combine asset health, weather intelligence, historical incidents, and grid impact into one actionable decision system."
  solution_summary: "GRIDGUARD AI is an AI-powered power-grid intelligence and predictive risk management platform that combines asset telemetry, weather exposure, historical incidents, asset criticality, and grid impact to identify outage-prone equipment and recommend prioritized maintenance and crew response. It features a load-bearing IBM Bob Operational Assistant backed by PostgreSQL/Supabase and FastAPI."
  key_features:
    - "Predictive Asset Risk Intelligence: Multi-factor composite risk scoring (0-100) and risk level classification (CRITICAL, HIGH, MEDIUM, LOW)."
    - "SCADA Sensor Health Monitoring: Real-time tracking of top-oil temperature, mechanical vibration, dielectric oil quality, partial discharge, and load."
    - "Weather-Aware Risk Intelligence: Dynamically incorporates storm fronts, lightning risk, and wind loading into failure probability."
    - "Explainable Multi-Factor Risk Engine: Provides transparent attribution showing why an asset is at risk."
    - "Grid Risk Visualization: Interactive topological map displaying substations, transformers, feeders, and active weather corridors."
    - "Predictive Maintenance Planning: Ranks work orders based on risk severity and enables operator creation of maintenance tasks."
    - "Crew Planning & Dispatch: Optimizes crew pre-positioning and dispatch based on ETA, skills, and risk zones."
    - "Load-Bearing IBM Bob Operational Assistant: Queries PostgreSQL telemetry, explains risk factors, and provides structured action recommendations for operator execution."
  repository_url: "https://github.com/ved1396/bob-ai-hackathon-invincible"
  demo_url: "https://gridgaurdai.vercel.app/"
